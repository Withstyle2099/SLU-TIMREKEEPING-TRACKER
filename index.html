<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLU Attendance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Plan: Aramco blue/green on cool neutrals; condensed display face for headings, Plex Sans for body.
   Layout: header + tab bar, then one working view per tab (timesheet grid is the centre of gravity). */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --ink:#1d2733; --muted:#5f6b78; --line:#d9e1e8;
  --blue:#00a3e0; --blue-deep:#0b5c8f; --green:#84bd00; --green-deep:#4f7a00;
  --tint:#e5f5fc; --zebra:#f8fafc; --off:#e4e8ec; --off-ink:#7a8692;
  --c-p:#dcefc0; --c-p-ink:#2f5a00; --c-lt:#ffe7b0; --c-lt-ink:#7a4f00; --c-noot:#f5a38f; --c-noot-ink:#6e1b07;
  --c-a:#f8c9c1; --c-a-ink:#8f1d0b; --c-s:#f6d0e2; --c-s-ink:#86184d; --c-l:#cbeaf8; --c-l-ink:#0a5a80;
  --c-t:#e3d8f0; --c-t-ink:#4b2a73; --warn:#fff5d6; --miss:#fde7e3; --today:#84bd00;
  --font-display:"IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body:"IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --font-mono:"IBM Plex Mono", Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1720; --surface:#16212c; --ink:#e6edf3; --muted:#9aa9b7; --line:#2a3846;
    --blue:#33b8ea; --blue-deep:#7fd0f2; --green:#9fd12a; --green-deep:#b9e35a;
    --tint:#12344a; --zebra:#1a2733; --off:#24313d; --off-ink:#7f8d9a;
    --c-p:#2f4a16; --c-p-ink:#cdeba1; --c-lt:#4d3a0d; --c-lt-ink:#ffd98a; --c-noot:#6b2414; --c-noot-ink:#ffc3b3;
    --c-a:#5a1f17; --c-a-ink:#ffb9ad; --c-s:#55203a; --c-s-ink:#ffc0dd; --c-l:#123f56; --c-l-ink:#a9def5;
    --c-t:#36284d; --c-t-ink:#d9c8f2; --warn:#3a3214; --miss:#3d1f1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1720; --surface:#16212c; --ink:#e6edf3; --muted:#9aa9b7; --line:#2a3846;
  --blue:#33b8ea; --blue-deep:#7fd0f2; --green:#9fd12a; --green-deep:#b9e35a;
  --tint:#12344a; --zebra:#1a2733; --off:#24313d; --off-ink:#7f8d9a;
  --c-p:#2f4a16; --c-p-ink:#cdeba1; --c-lt:#4d3a0d; --c-lt-ink:#ffd98a; --c-noot:#6b2414; --c-noot-ink:#ffc3b3;
  --c-a:#5a1f17; --c-a-ink:#ffb9ad; --c-s:#55203a; --c-s-ink:#ffc0dd; --c-l:#123f56; --c-l-ink:#a9def5;
  --c-t:#36284d; --c-t-ink:#d9c8f2; --warn:#3a3214; --miss:#3d1f1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{height:4px;background:linear-gradient(90deg,var(--green) 0 10%,var(--blue) 90% 100%)}
.top-in{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:12px 20px}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:36px;height:36px;border-radius:6px;background:var(--blue-deep);position:relative;overflow:hidden;flex:none}
.mark::after{content:"";position:absolute;inset:50% 0 0 0;background:var(--green);clip-path:polygon(0 40%,100% 0,100% 100%,0 100%)}
.mark span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:700 11px var(--font-display);z-index:1}
.brand h1{font-size:20px;line-height:1.1}
.brand p{margin:0;color:var(--muted);font-size:12px}
.top-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.month{display:flex;align-items:center;gap:6px}
.month button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:32px;height:32px;cursor:pointer}
.month input{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:32px;padding:0 8px}
.me{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.me img{width:26px;height:26px;border-radius:50%}
.me b{color:var(--ink);font-weight:600}
.me .btn{padding:4px 10px;font-size:12px}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px}
#gate[hidden]{display:none}
#gate .card{width:min(400px,100%)}
#gate .card-b{display:grid;gap:12px}
#gate input{width:100%}
#gate .or{text-align:center;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;padding:0 20px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--blue-deep);border-bottom-color:var(--green)}
main{padding:18px 20px 60px;max-width:1700px}
.notice{border:1px solid var(--line);background:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.notice.err{background:var(--miss)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:10px 12px}
.kpi.good{border-left-color:var(--green)}
.kpi.bad{border-left-color:#e2533a}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi strong{font:600 24px var(--font-display)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:17px}
.card-b{padding:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.chip{display:inline-grid;place-items:center;min-width:34px;height:20px;padding:0 4px;border-radius:4px;font:600 11px var(--font-body)}
.gridwrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
table.grid th,table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;height:30px}
table.grid thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-weight:600}
table.grid .who{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:0 8px;min-width:210px;max-width:230px}
table.grid thead .who{z-index:3}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:11px}
.dh{min-width:34px}
.dh .wd{display:block;font-size:10px;color:var(--muted);font-weight:500}
.dh.we{background:var(--zebra)}
.dh.today{background:var(--today);color:#132300}
.dh.today .wd{color:#132300}
tr.crew th{background:var(--blue-deep);color:#fff;text-align:left;padding:4px 8px;font:600 13px var(--font-display);position:sticky;left:0}
tr.wk td{height:20px;font-size:10px;font-weight:600}
td.long{background:var(--c-p);color:var(--c-p-ink)}
td.short{background:var(--c-lt);color:var(--c-lt-ink)}
td.cell button{all:unset;display:grid;place-items:center;width:100%;height:30px;cursor:pointer;font-weight:600;font-size:11px;box-sizing:border-box}
td.cell button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
td.cell.off button{background:var(--off);color:var(--off-ink);font-size:9px}
td.cell.miss button{background:var(--miss)}
td.cell.due button{background:var(--warn)}
td.cell button[disabled]{cursor:default}
.tot{min-width:46px;font-variant-numeric:tabular-nums}
.tot.h{background:var(--tint);font-weight:600;color:var(--blue-deep)}
tfoot td,tfoot th{background:var(--zebra);font-weight:600}
.code-P{background:var(--c-p);color:var(--c-p-ink)}
.code-LT1,.code-LT2,.code-LT3{background:var(--c-lt);color:var(--c-lt-ink)}
.code-NOOT{background:var(--c-noot);color:var(--c-noot-ink)}
.code-A{background:var(--c-a);color:var(--c-a-ink)}
.code-S{background:var(--c-s);color:var(--c-s-ink)}
.code-L{background:var(--c-l);color:var(--c-l-ink)}
.code-T{background:var(--c-t);color:var(--c-t-ink)}
.code-OFF{background:var(--off);color:var(--off-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;color:var(--ink);font-size:14px}
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.list th{font-weight:600;color:var(--muted);font-size:12px;background:var(--zebra)}
table.list td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar-ot{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--blue))}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.strip{display:flex;gap:2px;margin-top:6px}
.strip i{width:8px;height:14px;border-radius:2px;background:var(--off)}
.strip i.w{background:var(--blue-deep)}
.rules td input{width:52px;text-align:center}
.muted{color:var(--muted)}
.small{font-size:12px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;max-width:440px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,20,30,.45)}
.dlg-h{padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-h h3{font-size:18px}
.dlg-b{padding:14px 16px;display:grid;gap:12px}
.codes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.codes button{border:2px solid transparent;border-radius:6px;padding:8px 0;cursor:pointer;font-weight:600;font-size:12px}
.codes button[aria-pressed="true"]{border-color:var(--ink)}
.dlg-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
pre.mail{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.5 var(--font-mono);max-height:340px;overflow:auto}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
@media (max-width:600px){ .top-in,main{padding-left:16px;padding-right:16px} nav.tabs{padding:0 8px} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="bar"></div>
  <div class="top-in">
    <div class="brand">
      <div class="mark"><span>SLU</span></div>
      <div><h1 id="unitTitle">Safaniya Lab Unit attendance</h1><p id="unitSub">NAPLD · crew rotations R-35 and R-31</p></div>
    </div>
    <div class="top-right">
      <div class="month" aria-label="Working month">
        <button id="mPrev" aria-label="Previous month">‹</button>
        <input id="mPick" type="month" value="2026-11" aria-label="Month">
        <button id="mNext" aria-label="Next month">›</button>
      </div>
      <div class="me" id="me"></div>
    </div>
  </div>
  <nav class="tabs" aria-label="Sections">
    <a href="#timesheet">Timesheet</a>
    <a href="#overtime">Overtime</a>
    <a href="#daily-email">Daily email</a>
    <a href="#audit">Audit log</a>
    <a href="#staff">Staff</a>
    <a href="#config">Settings</a>
  </nav>
</header>
<main id="view"></main>

<div id="gate" hidden>
  <section class="card">
    <div class="card-h"><h2>Sign in</h2></div>
    <form class="card-b" id="gateForm">
      <p class="small muted" id="gateMsg">Sign in with the account the owner gave you.</p>
      <label class="f" for="gEmail">Email<input id="gEmail" type="email" autocomplete="username" required></label>
      <label class="f" for="gPass">Password<input id="gPass" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Sign in</button>
      <button class="btn" type="button" id="gReset">Forgot password</button>
      <div class="small" id="gateErr" style="color:#c2361b"></div>
    </form>
  </section>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <div class="dlg-h"><h3 id="dlgTitle">Attendance</h3><div class="small muted" id="dlgSub"></div></div>
    <div class="dlg-b">
      <div class="codes" id="dlgCodes" role="group" aria-label="Attendance code"></div>
      <label class="f" for="dlgWhy">Reason <span id="dlgWhyReq"></span><textarea id="dlgWhy" rows="2" placeholder="For example: badge reader missed the punch"></textarea></label>
      <div class="small muted" id="dlgLast"></div>
      <div class="small" id="dlgErr" style="color:#c2361b"></div>
    </div>
    <div class="dlg-f">
      <button type="button" class="btn" id="dlgCancel">Cancel</button>
      <button type="button" class="btn primary" id="dlgSave">Save</button>
    </div>
  </form>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ---------------- constants & rules ---------------- */
const CREWS = ["R-35 A","R-35 B","R-31 D","R-31 E","R-31 F"];
const C35 = "WWWWWoo"+"WWWWooo";          // index 0 = Sunday starting a long week
const C31 = "WWWWWWWooo"+"WWWWWWWoooo";   // index 0 = first day of a 7-day block followed by 3 off
const CODES = ["P","LT1","LT2","LT3","NO OT","A","S","L","T",""];
const CODE_NAME = {P:"Present",LT1:"Late up to 1 h",LT2:"Late 1–2 h",LT3:"Late 2–3 h","NO OT":"Late over 3 h, no OT",A:"Absent",S:"Sick leave",L:"Leave",T:"Training","":"Clear"};
const DEFAULT_CFG = {
  unitName:"Safaniya Lab Unit (SLU)", department:"NAPLD",
  anchors:{"R-35 A":"2026-11-08","R-35 B":"2026-11-01","R-31 D":"2026-11-09","R-31 E":"2026-11-02","R-31 F":"2026-11-16"},
  lateDed:{LT1:1,LT2:2,LT3:3},
  ot:{long:[2,3,3,3,1,0,0], short:[2,1,1,3,0,0,0], r31:[2,4,4,4,4,4,12]},
  recipients:""
};
const cls = c => "code-" + (c||"").replace(/\s/g,"");
const pad = n => String(n).padStart(2,"0");
const DAY = 86400000;
const riyadhToday = () => new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const mod = (n,d) => ((n%d)+d)%d;
const daysIn = m => { const [y,mo]=m.split("-").map(Number); return new Date(Date.UTC(y,mo,0)).getUTCDate(); };
const wd = ds => new Date(ds+"T00:00:00Z").getUTCDay();
const WD = ["Su","Mo","Tu","We","Th","Fr","Sa"];
const fmtDate = ds => new Date(ds+"T00:00:00Z").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});

function cyc(crew, ds, cfg){
  const c = crew.startsWith("R-35") ? C35 : C31;
  const start = (cfg.anchors||{})[crew] || DEFAULT_CFG.anchors[crew];
  return {c, i: mod(Math.round((Date.parse(ds)-Date.parse(start))/DAY), c.length)};
}
const isWork = (crew,ds,cfg) => { const {c,i}=cyc(crew,ds,cfg); return c[i]==="W"; };
function weekType(crew,ds,cfg){ if(!crew.startsWith("R-35")) return ""; return cyc(crew,ds,cfg).i<7?"Long":"Short"; }
function blockDay(crew,ds,cfg){ const {c,i}=cyc(crew,ds,cfg); if(c[i]!=="W") return 0; let j=i; while(j>0&&c[j-1]==="W") j--; return i-j+1; }
function allowance(crew,ds,cfg){
  const p = blockDay(crew,ds,cfg); if(!p) return 0;
  const ot = cfg.ot||DEFAULT_CFG.ot;
  const arr = crew.startsWith("R-31") ? ot.r31 : (weekType(crew,ds,cfg)==="Long" ? ot.long : ot.short);
  return Number(arr[p-1]||0);
}
function otFor(crew,ds,code,cfg){
  if(!isWork(crew,ds,cfg)) return 0;
  if(!["P","LT1","LT2","LT3"].includes(code)) return 0;
  const ded = (cfg.lateDed||DEFAULT_CFG.lateDed)[code]||0;
  return Math.max(0, allowance(crew,ds,cfg)-ded);
}

/* ---------------- state ---------------- */
const S = { db:null, user:null, me:null, access:{editors:[],viewers:[]}, noAccess:false, canWrite:null, isOwner:false,
  cfg: structuredClone(DEFAULT_CFG), staff:[], rows:{}, audit:[], month:"2026-11",
  loaded:{cfg:false,staff:false,rows:false,audit:false}, err:"", slow:false, readOnly:false, ready:false };
let unsubRows=null;

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==="class") e.className=v; else if(k==="text") e.textContent=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v===true?"":v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); }
  return e;
}
function toast(msg){ const t=el("div",{class:"toast",role:"status",text:msg}); document.body.append(t); setTimeout(()=>t.remove(),2600); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("Copied"); }catch{ toast("Copy blocked here. Select the text and press Ctrl+C."); } }
const activeStaff = () => S.staff.filter(s=>s.active!==false).sort((a,b)=>CREWS.indexOf(a.crew)-CREWS.indexOf(b.crew)||(a.order||0)-(b.order||0));
const dayRec = (eid,dd) => ((S.rows[eid]||{}).days||{})[dd] || null;
const nameCache={};
async function names(ids){
  const u=[...new Set(ids.filter(Boolean))]; if(!S.db||!u.length) return {};
  await Promise.all(u.filter(id=>!(id in nameCache)).map(async id=>{ try{ const d=await S.db.doc("users/"+id).get(); nameCache[id]=d.exists?d.data():null; }catch{ nameCache[id]=null; } }));
  const o={}; u.forEach(id=>{ if(nameCache[id]) o[id]=nameCache[id]; }); return o;
}

/* merge-write one nested field; create the doc if it is missing */
async function mergeWrite(path, body){
  await S.db.doc(path).set(body,{merge:true});
}

/* ---------------- month stats ---------------- */
function monthStats(){
  const m=S.month, n=daysIn(m), today=riyadhToday();
  const per={}; const daily=Array.from({length:n},()=>({duty:0,present:0,late:0,absent:0,missing:0}));
  for(const s of activeStaff()){
    const t={P:0,late:0,noot:0,A:0,S:0,L:0,T:0,ot:0,duty:0,missing:0};
    for(let d=1; d<=n; d++){
      const ds=`${m}-${pad(d)}`, dd=pad(d), r=dayRec(s.id,dd), c=r?r.c:"", work=isWork(s.crew,ds,S.cfg);
      if(c==="P") t.P++; if(["LT1","LT2","LT3","NO OT"].includes(c)) t.late++; if(c==="NO OT") t.noot++;
      if(c==="A") t.A++; if(c==="S") t.S++; if(c==="L") t.L++; if(c==="T") t.T++;
      t.ot += otFor(s.crew,ds,c,S.cfg);
      if(work && !["L","T"].includes(c)){ t.duty++; daily[d-1].duty++; }
      if(work && !c && ds<=today){ t.missing++; daily[d-1].missing++; }
      if(c==="P") daily[d-1].present++; if(["LT1","LT2","LT3","NO OT"].includes(c)) daily[d-1].late++; if(c==="A"||c==="S") daily[d-1].absent++;
    }
    const base=t.P+t.late+t.A+t.S; t.rate= base? Math.round(100*(t.P+t.late)/base):null;
    per[s.id]=t;
  }
  const sum=k=>Object.values(per).reduce((a,t)=>a+t[k],0);
  const base=sum("P")+sum("late")+sum("A")+sum("S");
  return {per,daily,tot:{P:sum("P"),late:sum("late"),noot:sum("noot"),A:sum("A"),S:sum("S"),ot:sum("ot"),missing:sum("missing"),duty:sum("duty"),rate: base?Math.round(100*(sum("P")+sum("late"))/base):null}};
}

/* ---------------- cell dialog ---------------- */
let dlgCtx=null;
async function openCell(s,ds){
  if(!S.db||S.readOnly) return;
  const dd=ds.slice(8), r=dayRec(s.id,dd), cur=r?r.c:"", work=isWork(s.crew,ds,S.cfg), past=ds<riyadhToday();
  dlgCtx={s,ds,dd,cur,pick:cur,past};
  $("#dlgTitle").textContent=s.name;
  const wt=weekType(s.crew,ds,S.cfg);
  $("#dlgSub").textContent=`${fmtDate(ds)} · ${s.crew}${wt?` · ${wt} week`:""} · ${work?`work day ${blockDay(s.crew,ds,S.cfg)}, OT available ${allowance(s.crew,ds,S.cfg)} h`:"day off"}`;
  const box=$("#dlgCodes"); box.replaceChildren(...CODES.map(c=>el("button",{type:"button",class:c?cls(c):"","aria-pressed":String(c===cur),title:CODE_NAME[c],onclick:e=>{ dlgCtx.pick=c; box.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed","false")); e.currentTarget.setAttribute("aria-pressed","true"); }},c||"Clear")));
  $("#dlgWhy").value=""; $("#dlgWhyReq").textContent=past?"(required for a past date)":"(optional)"; $("#dlgErr").textContent="";
  $("#dlgLast").textContent= r ? (r.src?`Pre-filled from ${r.src}.`:"Loading who changed it last…") : "Not entered yet.";
  $("#dlg").showModal();
  if(r&&r.by){ const ps=await names([r.by]); $("#dlgLast").textContent=`Last changed by ${(ps[r.by]&&ps[r.by].name)||"Someone"} on ${new Date(r.at).toLocaleString("en-GB",{timeZone:"Asia/Riyadh",dateStyle:"medium",timeStyle:"short"})}${r.why?` · ${r.why}`:""}.`; }
}
$("#dlgCancel").addEventListener("click",()=>$("#dlg").close());
$("#dlgSave").addEventListener("click",async()=>{
  const x=dlgCtx; if(!x) return; const why=$("#dlgWhy").value.trim();
  if(x.pick===x.cur){ $("#dlg").close(); return; }
  if(x.past&&!why){ $("#dlgErr").textContent="Add a reason: this date has passed."; return; }
  const btn=$("#dlgSave"); btn.disabled=true;
  try{
    const at=new Date().toISOString();
    const val = x.pick ? {c:x.pick,by:S.me&&S.me.id||null,at,why} : {c:"",by:S.me&&S.me.id||null,at,why};
    await mergeWrite(`months/${S.month}/rows/${x.s.id}`,{emp:x.s.id,days:{[x.dd]:val}});
    await logAudit({what:"Attendance",emp:x.s.id,date:x.ds,old:x.cur,new:x.pick,why});
    $("#dlg").close(); toast("Saved");
  }catch(e){
    if(e&&e.code==="permission-denied"){ S.readOnly=true; $("#dlg").close(); render(); }
    else $("#dlgErr").textContent="Not saved: "+((e&&e.message)||"try again");
  }finally{ btn.disabled=false; }
});
async function logAudit(e){
  const at=new Date().toISOString(), day=riyadhToday();
  const id=at.replace(/[^0-9]/g,"")+Math.random().toString(36).slice(2,6);
  try{ await mergeWrite("audit/"+day,{day,entries:{[id]:{...e,by:S.me&&S.me.id||null,at}}}); }catch{ /* audit failure shouldn't block the entry */ }
}

/* ---------------- routing & render ---------------- */
const ROUTES={timesheet:viewTimesheet,overtime:viewOvertime,"daily-email":viewMail,audit:viewAudit,staff:viewStaff,config:viewConfig};
let renderSeq=0;
async function render(){
  const seq=++renderSeq; const key=(location.hash||"#timesheet").slice(1); const fn=ROUTES[key]||viewTimesheet;
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+(ROUTES[key]?key:"timesheet")?"page":"false"));
  $("#unitTitle").textContent=`${S.cfg.unitName.replace(/\s*\(SLU\)/,"")} attendance`; $("#unitSub").textContent=`${S.cfg.department} · crew rotations R-35 and R-31`;
  const kids=await fn(); if(seq!==renderSeq) return;
  const v=$("#view"), sx=(v.querySelector(".gridwrap")||{}).scrollLeft||0;
  v.replaceChildren(...kids.flat().filter(Boolean));
  const g=v.querySelector(".gridwrap"); if(g&&sx) g.scrollLeft=sx;
}
let rT=null; const soon=()=>{ clearTimeout(rT); rT=setTimeout(render,60); };
window.addEventListener("hashchange",render);
function setMonth(m){ S.month=m; $("#mPick").value=m; subRows(); soon(); }
$("#mPick").addEventListener("change",e=>{ if(/^\d{4}-\d{2}$/.test(e.target.value)) setMonth(e.target.value); });
const shift=k=>{ const [y,mo]=S.month.split("-").map(Number); const d=new Date(Date.UTC(y,mo-1+k,1)); setMonth(`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}`); };
$("#mPrev").addEventListener("click",()=>shift(-1)); $("#mNext").addEventListener("click",()=>shift(1));

function onErr(e){ if(e&&e.code==="permission-denied"){ S.err="You don't have access to this data. Ask the owner to add your email in Settings."; } else if(e){ S.err="Couldn't load shared data ("+(e.code||"error")+")."; } soon(); }
function subRows(){
  if(!S.db) return; if(unsubRows) unsubRows(); S.rows={}; S.loaded.rows=false;
  unsubRows=S.db.collection(`months/${S.month}/rows`).onSnapshot(q=>{ const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.rows=o; S.loaded.rows=true; soon(); },onErr);
}

(function boot(){
  const today=riyadhToday(); S.month=today>="2026-11"?today.slice(0,7):"2026-11"; $("#mPick").value=S.month;
  render();
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||cfg.apiKey.startsWith("PASTE")){ S.ready=true; soon(); return; }
  firebase.initializeApp(cfg);
  const auth=firebase.auth(), db=firebase.firestore();
  const gate=$("#gate"), gErr=$("#gateErr");
  const fail=e=>{ gErr.textContent=({"auth/invalid-credential":"Wrong email or password.","auth/wrong-password":"Wrong email or password.","auth/user-not-found":"No account with that email. Ask the owner to create one.","auth/too-many-requests":"Too many tries. Wait a few minutes.","auth/popup-closed-by-user":""})[e.code]??(e.message||"Sign-in failed"); };
  $("#gateForm").addEventListener("submit",e=>{ e.preventDefault(); gErr.textContent=""; auth.signInWithEmailAndPassword($("#gEmail").value.trim(),$("#gPass").value).catch(fail); });
  $("#gReset").addEventListener("click",()=>{ const em=$("#gEmail").value.trim(); if(!em){ gErr.textContent="Type your email first."; return; } auth.sendPasswordResetEmail(em).then(()=>{ gErr.textContent="Reset link sent. Check your email."; }).catch(fail); });
  let unsubs=[];
  auth.onAuthStateChanged(async u=>{
    unsubs.forEach(f=>f()); unsubs=[]; if(unsubRows){ unsubRows(); unsubRows=null; }
    if(!u){ S.db=null; S.ready=false; gate.hidden=false; $("#me").replaceChildren(); return; }
    gate.hidden=true;
    const email=(u.email||"").toLowerCase(), name=u.displayName||email.split("@")[0];
    S.me={id:u.uid,name,email}; S.db=db; S.ready=true; S.err=""; S.noAccess=false; S.readOnly=false;
    try{ await db.doc("users/"+u.uid).set({name,email},{merge:true}); }catch{}
    // who is the owner? (only the real owner can create this doc; the Firestore rules enforce it)
    let acc=null;
    try{ const a=await db.doc("config/access").get(); acc=a.exists?a.data():null; }catch{}
    if(!acc){ try{ await db.doc("config/access").set({owner:email,editors:[],viewers:[]}); acc={owner:email,editors:[],viewers:[]}; }catch{ acc={editors:[],viewers:[]}; } }
    S.access={editors:[],viewers:[],...acc};
    S.isOwner=!!acc.owner&&acc.owner===email;
    const isEd=S.isOwner||(S.access.editors||[]).includes(email), isVw=isEd||(S.access.viewers||[]).includes(email);
    S.canWrite=isEd; S.readOnly=!isEd; S.noAccess=!isVw;
    $("#me").replaceChildren(el("span",{},el("b",{text:name}),` · ${S.isOwner?"Owner":isEd?"Editor":isVw?"Viewer":"No access"}`),el("button",{class:"btn",type:"button",onclick:()=>auth.signOut(),text:"Sign out"}));
    if(!isVw){ soon(); return; }
    setTimeout(()=>{ S.slow=true; soon(); },10000);
    unsubs.push(db.doc("config/access").onSnapshot(d=>{ if(d.exists){ S.access={editors:[],viewers:[],...d.data()}; } },()=>{}));
    unsubs.push(db.doc("config/main").onSnapshot(d=>{ const v=d.exists?d.data():{}; S.cfg={...structuredClone(DEFAULT_CFG),...v,anchors:{...DEFAULT_CFG.anchors,...(v.anchors||{})},lateDed:{...DEFAULT_CFG.lateDed,...(v.lateDed||{})},ot:{...DEFAULT_CFG.ot,...(v.ot||{})}}; S.loaded.cfg=true; soon(); },onErr));
    unsubs.push(db.collection("staff").onSnapshot(q=>{ S.staff=q.docs.map(d=>({id:d.id,...d.data()})); S.loaded.staff=true; soon(); },onErr));
    unsubs.push(db.collection("audit").orderBy("day","desc").limit(62).onSnapshot(q=>{ S.audit=q.docs.map(d=>d.data()); S.loaded.audit=true; if((location.hash||"")==="#audit") soon(); },onErr));
    subRows();
  });
})();
